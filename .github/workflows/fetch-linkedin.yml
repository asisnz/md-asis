name: fetch-linkedin

# Weekly cache refresh for STEP 1a (see README.md and
# MIGHT/ASSET-2026Q3.md). Calls py-asis's listener (over Cloudflare
# Tunnel + Access) once per connection and commits the results to the
# single MAY/LOG-2026Q3.log. A connection that fails or times out is
# skipped, not treated as a job failure — the fetch-linkedin skill
# already handles a missing log entry as MISSING.
#
# Requires repo secrets: LINKEDIN_FETCH_URL, CF_ACCESS_CLIENT_ID,
# CF_ACCESS_CLIENT_SECRET, LISTENER_SHARED_SECRET.

on:
  schedule:
    # Sunday 20:00 UTC — before the Monday (NZT) batch day. Adjust if
    # the batch day changes.
    - cron: "0 20 * * 0"
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: 'Skip step 1a (the LinkedIn fetch) and run only step 1b (refresh-values)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    if: ${{ github.event.inputs.skip_fetch != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.JSON_PAT }}

      - name: Initialise submodules
        run: |
          git config --global url."https://${{ secrets.JSON_PAT }}@github.com/jayreck996/JSON".insteadOf "https://github.com/jayreck996/JSON"
          git config --global url."https://${{ secrets.CSV_PAT }}@github.com/jayreck996/CSV".insteadOf "https://github.com/jayreck996/CSV"
          git config --global url."https://${{ secrets.YML_PAT }}@github.com/jayreck996/YML".insteadOf "https://github.com/jayreck996/YML"
          git config --global url."https://${{ secrets.JSONL_PAT }}@github.com/jayreck996/JSONL".insteadOf "https://github.com/jayreck996/JSONL"
          git submodule update --init -- CSV JSON YML JSONL

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch LinkedIn snapshots
        env:
          LINKEDIN_FETCH_URL: ${{ secrets.LINKEDIN_FETCH_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          LISTENER_SHARED_SECRET: ${{ secrets.LISTENER_SHARED_SECRET }}
        run: python3 .github/scripts/fetch_linkedin_cache.py

      - name: Commit updated cache files
        run: |
          # Commit new JSONL entries to the submodule first
          cd JSONL
          git checkout main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- ASIS/
          if git diff --cached --quiet; then
            echo "No cache changes this run — nothing to commit."
            exit 0
          fi
          git commit -m "chore(linkedin-cache): weekly fetch-linkedin snapshot update"
          for attempt in 1 2 3 4 5; do
            if git push; then break; fi
            echo "JSONL push rejected (attempt $attempt) -- rebasing..."
            git fetch origin main && git rebase origin/main
          done
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- JSONL
          git commit -m "chore(linkedin-cache): update JSONL submodule pointer"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt $attempt) -- rebasing onto origin/main and retrying..."
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::git push failed after 5 attempts"
          exit 1

  # Step 1b: win/tie/lost totals from COULD/TABLE-2026Q3.csv onto
  # CAN/TREE-2026Q3.json. Repo-only (no Mac mini). Own job so it gets a fresh
  # checkout (including 1a's push and any feedback that landed during the
  # ~6-minute fetch) and its own commit. Runs even if 1a failed. Step 2 re-runs
  # the same idempotent script right before generating.
  refresh-values:
    needs: fetch
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.JSON_PAT }}

      - name: Initialise submodules
        run: |
          git config --global url."https://${{ secrets.JSON_PAT }}@github.com/jayreck996/JSON".insteadOf "https://github.com/jayreck996/JSON"
          git config --global url."https://${{ secrets.CSV_PAT }}@github.com/jayreck996/CSV".insteadOf "https://github.com/jayreck996/CSV"
          git config --global url."https://${{ secrets.YML_PAT }}@github.com/jayreck996/YML".insteadOf "https://github.com/jayreck996/YML"
          git config --global url."https://${{ secrets.JSONL_PAT }}@github.com/jayreck996/JSONL".insteadOf "https://github.com/jayreck996/JSONL"
          git submodule update --init -- CSV JSON YML JSONL

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh subtype values from feedback
        run: python3 .github/scripts/update_tree_values.py

      - name: Commit updated tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Commit updated JSON to the submodule repo first
          cd JSON
          git checkout main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- ASIS/JSON-2026Q4.json
          if git diff --cached --quiet; then
            echo "No value changes this run — nothing to commit."
            exit 0
          fi
          git commit -m "chore(step-1b): refresh subtype values from feedback"
          git push
          cd ..
          # Update the submodule pointer in the parent repo
          git add -- JSON
          git commit -m "chore(step-1b): update JSON submodule pointer"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) -- rebasing onto origin/main and retrying..."
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::git push failed after 5 attempts"
          exit 1
